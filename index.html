<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DJ Bites · Pure Veg</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    
    <style>
        /* All previous styles remain same */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .customer-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        /* Pull to Refresh */
        .ptr-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fc8019;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-100%);
            transition: transform 0.3s;
            z-index: 9999;
            font-weight: 600;
            gap: 10px;
        }

        .ptr-indicator.show {
            transform: translateY(0);
        }

        .ptr-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            background: linear-gradient(145deg, #fff8f0, #fff);
            border-radius: 50px;
            padding: 10px 16px;
            box-shadow: 0 5px 15px rgba(252, 128, 25, 0.1);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, #fc8019, #ff5722);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(10deg);
        }

        .logo-icon i {
            font-size: 1.5rem;
            color: white;
            transform: rotate(-10deg);
        }

        .logo-text h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fc8019, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pure-veg-tag {
            background: linear-gradient(145deg, #0a7e07, #1e7b4c);
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .outlet-status {
            background: #f0f0f0;
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.open { background: #0a7e07; box-shadow: 0 0 10px #0a7e07; }
        .status-dot.closed { background: #ff0000; box-shadow: 0 0 10px #ff0000; }

        .search-container {
            margin: 12px 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid #eee;
            border-radius: 40px;
            font-size: 16px;
        }

        .search-input:focus {
            border-color: #fc8019;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }

        .quick-actions::-webkit-scrollbar {
            display: none;
        }

        .quick-action-btn {
            background: white;
            border: 2px solid #fc8019;
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fc8019;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
        }

        .category-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 8px 0 16px;
            -webkit-overflow-scrolling: touch;
        }

        .category-tab {
            background: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
            white-space: nowrap;
            border: 2px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
        }

        .category-tab.active {
            background: #fc8019;
            color: white;
            border-color: #fc8019;
        }

        .category-section {
            margin: 20px 0;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 3px solid #fc8019;
            padding-bottom: 5px;
        }

        .category-header i {
            font-size: 1.3rem;
            color: #fc8019;
            background: #fff4e5;
            padding: 6px;
            border-radius: 50%;
        }

        .category-header h3 {
            font-size: 1.1rem;
        }

        .menu-item {
            display: flex;
            gap: 12px;
            background: white;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 2px solid #f0f0f0;
            position: relative;
        }

        .menu-item.out-of-stock {
            opacity: 0.5;
            background: #f5f5f5;
        }

        .out-of-stock-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff4444;
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
        }

        .item-image-block {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }

        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .popular-badge {
            background: #ff9800;
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.55rem;
        }

        .item-price {
            font-weight: 700;
            color: #fc8019;
            font-size: 1rem;
        }

        .item-meta {
            display: flex;
            gap: 8px;
            font-size: 0.65rem;
            color: #999;
            margin: 4px 0;
        }

        .favorite-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .item-notes {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #eee;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f8f8;
            padding: 4px 8px;
            border-radius: 30px;
            margin-left: auto;
        }

        .qty-btn {
            background: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 600;
            color: #fc8019;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-height: 36px;
        }

        .qty-btn:disabled {
            opacity: 0.3;
        }

        .qty-num {
            font-weight: 700;
            font-size: 1rem;
            min-width: 20px;
            text-align: center;
        }

        /* Live Tracking Timeline */
        .live-tracking-card {
            background: linear-gradient(145deg, #fff9f2, #fff);
            border: 3px solid #fc8019;
            border-radius: 25px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(252, 128, 25, 0.2);
            position: relative;
            overflow: hidden;
        }

        .live-tracking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #fc8019, #ff5722, #fc8019);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .order-id-badge {
            background: #fc8019;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
        }

        .live-badge {
            background: #ff4444;
            color: white;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .tracking-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 20px;
        }

        .tracking-timeline::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 40px;
            right: 40px;
            height: 4px;
            background: #e0e0e0;
            z-index: 1;
        }

        .tracking-step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .step-icon {
            width: 40px;
            height: 40px;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 1.2rem;
            color: #999;
            transition: all 0.3s;
        }

        .tracking-step.completed .step-icon {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .tracking-step.active .step-icon {
            background: #fc8019;
            border-color: #fc8019;
            color: white;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .step-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
        }

        .tracking-step.active .step-label {
            color: #fc8019;
        }

        .tracking-details {
            background: #f8f8f8;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.9rem;
        }

        .eta-timer {
            background: #fc8019;
            color: white;
            padding: 8px 15px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }

        .summary-wrap {
            background: linear-gradient(145deg, #fff9f2, #fff);
            border-radius: 30px;
            padding: 16px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(252, 128, 25, 0.1);
            position: sticky;
            bottom: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin: 6px 0;
        }

        .summary-row.total {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 2px dashed #fc8019;
            padding-top: 10px;
            margin-top: 10px;
        }

        .order-btn {
            background: linear-gradient(145deg, #fc8019, #ff5722);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(252, 128, 25, 0.3);
            min-height: 56px;
        }

        .order-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #fc8019;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-preview {
            background: #f9f9f9;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .preview-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.9rem;
            border-bottom: 1px dashed #eee;
        }

        .preview-total {
            font-weight: 700;
            color: #fc8019;
            margin-top: 10px;
            text-align: right;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #eee;
            border-radius: 30px;
            font-size: 16px;
            margin: 8px 0;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            min-height: 50px;
        }

        .modal-btn.primary {
            background: #fc8019;
            color: white;
        }

        .modal-btn.secondary {
            background: #f0f0f0;
            color: #666;
        }

        .modal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Order Status (Old) */
        .order-status-card {
            background: linear-gradient(145deg, #fff9f2, #fff);
            border: 2px solid #fc8019;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
        }

        .status-timeline {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .status-step {
            text-align: center;
            flex: 1;
        }

        .status-step.completed .step-icon {
            background: #4CAF50;
            color: white;
        }

        .status-step.active .step-icon {
            background: #fc8019;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 5px;
        }

        .step-label {
            font-size: 0.7rem;
            color: #666;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1500;
            animation: slideUp 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Zoom Modal */
        .zoom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .zoom-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .zoom-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 20px;
        }

        .zoom-close {
            position: absolute;
            top: -40px;
            right: -40px;
            background: #fc8019;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #fc8019;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Safe Area */
        @supports (padding: max(0px)) {
            .customer-container {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <!-- Pull to Refresh -->
    <div class="ptr-indicator" id="ptrIndicator">
        <div class="ptr-spinner"></div>
        <span>Refreshing...</span>
    </div>

    <div class="customer-container" id="app">
        <!-- Header -->
        <div class="brand-header">
            <div class="logo-wrapper">
                <div class="logo-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <div class="logo-text">
                    <h2>DJ Bites</h2>
                </div>
            </div>
            <div class="pure-veg-tag">
                <i class="fas fa-leaf"></i> PURE VEG
            </div>
        </div>

        <!-- Outlet Status -->
        <div class="outlet-status">
            <div class="status-badge">
                <span class="status-dot open" id="statusDot"></span>
                <span id="statusText">Outlet Open</span>
            </div>
            <span id="orderCount">0 orders</span>
        </div>

        <!-- Live Tracking Timeline - Will show when order is active -->
        <div id="liveTrackingContainer"></div>

        <!-- Search -->
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search dishes..." oninput="debouncedFilter()">
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-action-btn" onclick="showFavorites()">
                <i class="fas fa-heart"></i> Favorites
            </button>
            <button class="quick-action-btn" onclick="showHistory()">
                <i class="fas fa-history"></i> Orders
            </button>
            <button class="quick-action-btn" onclick="reorderLast()">
                <i class="fas fa-redo-alt"></i> Reorder
            </button>
            <button class="quick-action-btn" onclick="clearCart()">
                <i class="fas fa-trash"></i> Clear
            </button>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs"></div>

        <!-- Menu Container -->
        <div id="menuContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading delicious menu...</p>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="summary-wrap">
            <div class="summary-row">
                <span>Total Items</span>
                <span id="totalItems">0</span>
            </div>
            <div class="summary-row">
                <span>Total Amount</span>
                <span id="totalPrice">₹0</span>
            </div>
            <div class="summary-row total">
                <span>To Pay</span>
                <span id="totalPay">₹0</span>
            </div>
        </div>

        <!-- Order Button -->
        <button class="order-btn" id="orderBtn" onclick="openOrderModal()">
            <i class="fas fa-shopping-cart"></i> Place Order
        </button>

        <!-- Current Order Status (Old - keeping for backward compatibility) -->
        <div id="currentOrderStatus"></div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">
                <i class="fas fa-shopping-bag"></i> Your Order
            </div>
            
            <div class="order-preview" id="orderPreview"></div>
            
            <input type="text" class="modal-input" id="customerName" placeholder="Your Name *">
            <input type="tel" class="modal-input" id="customerPhone" placeholder="Phone Number *">
            
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="submitOrder()" id="submitOrderBtn">
                    <i class="fas fa-check"></i> Confirm Order
                </button>
                <button class="modal-btn secondary" onclick="closeOrderModal()">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div style="text-align: center;">
                <div style="font-size: 4rem; color: #4CAF50; margin-bottom: 15px;">

    <script>
        // ========== CONFIG ==========
        // WARNING: API key exposed - in production, use backend proxy
        const JSONBIN_API_KEY = "$2a$10$FZ4fy.fN71Cx6tT/zCswOOJdebJq50OaG14QuRkquiOy9r08I/1Oi";
        const JSONBIN_BIN_ID = "69a41221ae596e708f54bd64";
        const CUSTOMER_ID = 'cust_' + (localStorage.getItem('customerId') || Math.random().toString(36).substr(2, 9));
        
        try {
            localStorage.setItem('customerId', CUSTOMER_ID);
        } catch (e) {
            console.log('localStorage quota issue');
        }

        // ========== SAMPLE MENU DATA (FALLBACK) ==========
        const SAMPLE_MENU = [
            { id: 'item1', name: 'Paneer Tikka', price: 180, category: 'Starters', popular: true, prepTime: '15 min' },
            { id: 'item2', name: 'Veg Momos', price: 120, category: 'Momos', popular: true, prepTime: '12 min' },
            { id: 'item3', name: 'Spring Roll', price: 110, category: 'Spring Rolls', prepTime: '10 min' },
            { id: 'item4', name: 'Chilli Paneer', price: 200, category: 'Chinese', popular: true, prepTime: '15 min' },
            { id: 'item5', name: 'Veg Burger', price: 90, category: 'Burgers', prepTime: '10 min' },
            { id: 'item6', name: 'French Fries', price: 80, category: 'Fries', popular: true, prepTime: '8 min' },
            { id: 'item7', name: 'Garlic Bread', price: 100, category: 'Breads', prepTime: '10 min' },
            { id: 'item8', name: 'Margherita Pizza', price: 250, category: 'Pizza', popular: true, prepTime: '20 min' },
            { id: 'item9', name: 'Veg Biryani', price: 220, category: 'Rice', prepTime: '25 min' },
            { id: 'item10', name: 'Dal Makhani', price: 160, category: 'Main Course', prepTime: '20 min' }
        ];

        const SAMPLE_IMAGES = {
            'item1': 'https://i.ibb.co/sFYNbqM/paneer-tikka.jpg',
            'item2': 'https://i.ibb.co/QjZy0vD/momos.jpg',
            'item3': 'https://i.ibb.co/6yqWv0L/spring-roll.jpg',
            'item4': 'https://i.ibb.co/6nZqVhH/chilli-paneer.jpg',
            'item5': 'https://i.ibb.co/ZHR8s0w/burger.jpg',
            'item6': 'https://i.ibb.co/RcZnYJd/fries.jpg',
            'item7': 'https://i.ibb.co/1vzW0fN/garlic-bread.jpg',
            'item8': 'https://i.ibb.co/N3vQ0Bc/pizza.jpg',
            'item9': 'https://i.ibb.co/6PqZ8Vr/biryani.jpg',
            'item10': 'https://i.ibb.co/5YQYdQK/dal-makhani.jpg'
        };

        // ========== STATE ==========
        let menuItems = [];
        let quantities = {};
        let itemNotes = {};
        let favorites = [];
        let outletOpen = true;
        let outOfStockItems = [];
        let itemImages = {};
        let orders = [];
        let searchTerm = '';
        let pullToRefresh = null;
        let isSubmitting = false;
        let debounceTimer = null;
        let syncInterval = null;
        let lastSyncTime = 0;
        let activeOrder = null;
        let etaTimer = null;
        let isLoading = true;

        // Load from localStorage safely
        try {
            favorites = JSON.parse(localStorage.getItem('favorites_' + CUSTOMER_ID)) || [];
            orders = JSON.parse(localStorage.getItem('orders_' + CUSTOMER_ID)) || [];
        } catch (e) {
            favorites = [];
            orders = [];
        }

        // ========== DEBOUNCE FUNCTION ==========
        window.debouncedFilter = function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                searchTerm = document.getElementById('searchInput').value;
                renderMenu();
            }, 300);
        };

        // ========== SAFE HTML FUNCTION (XSS Protection) ==========
        function safeHTML(str) {
            if (!str) return '';
            return DOMPurify.sanitize(str, { USE_PROFILES: { html: true } });
        }

        // ========== NOTIFICATION ==========
        function showNotification(message, type = 'success', duration = 3000) {
            const safeMessage = DOMPurify.sanitize(message);
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                ${safeMessage}
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, duration);
            
            try {
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            } catch (e) {
                console.log('Vibration not supported');
            }
        }

        // ========== CHECK LOCALSTORAGE QUOTA ==========
        function safeLocalStorageSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    try {
                        const keysToRemove = [];
                        for (let i = 0; i < localStorage.length; i++) {
                            const k = localStorage.key(i);
                            if (k.includes('cached') || k.includes('orders_')) {
                                keysToRemove.push(k);
                            }
                        }
                        keysToRemove.forEach(k => localStorage.removeItem(k));
                        
                        localStorage.setItem(key, value);
                        return true;
                    } catch (e2) {
                        return false;
                    }
                }
                return false;
            }
        }

        // ========== LOAD DATA ==========
        async function loadData() {
            try {
                // First, try to load from cache
                const cachedMenu = localStorage.getItem('cachedMenu');
                const cachedImages = localStorage.getItem('cachedImages');
                const cachedStatus = localStorage.getItem('cachedOutletStatus');
                const cachedOutOfStock = localStorage.getItem('cachedOutOfStock');
                
                if (cachedMenu) {
                    menuItems = JSON.parse(cachedMenu);
                    console.log('Loaded menu from cache:', menuItems.length, 'items');
                } else {
                    // If no cache, use sample data immediately
                    menuItems = [...SAMPLE_MENU];
                    itemImages = {...SAMPLE_IMAGES};
                    console.log('Using sample menu data');
                }
                
                if (cachedImages) itemImages = {...itemImages, ...JSON.parse(cachedImages)};
                if (cachedStatus) outletOpen = JSON.parse(cachedStatus);
                if (cachedOutOfStock) outOfStockItems = JSON.parse(cachedOutOfStock);
                
                isLoading = false;
                renderUI();
                
                // Rate limiting - don't fetch more than once every 5 seconds
                const now = Date.now();
                if (now - lastSyncTime < 5000) {
                    return;
                }
                lastSyncTime = now;
                
                // Then try to fetch latest from cloud
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': JSONBIN_API_KEY }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const record = data.record || {};
                    
                    if (record.menuItems && record.menuItems.length > 0) {
                        menuItems = record.menuItems;
                    }
                    if (record.images) {
                        itemImages = {...itemImages, ...record.images};
                    }
                    outletOpen = record.outletOpen !== undefined ? record.outletOpen : outletOpen;
                    outOfStockItems = record.outOfStockItems || outOfStockItems;
                    
                    // Update order statuses
                    const cloudOrders = record.orders || [];
                    let orderUpdated = false;
                    
                    cloudOrders.forEach(cloudOrder => {
                        const localOrder = orders.find(o => o.id === cloudOrder.id);
                        if (localOrder && localOrder.status !== cloudOrder.status) {
                            localOrder.status = cloudOrder.status;
                            orderUpdated = true;
                            
                            if (activeOrder && activeOrder.id === cloudOrder.id) {
                                activeOrder.status = cloudOrder.status;
                            }
                            
                            showNotification(`Order #${cloudOrder.id.slice(-6)} is now ${cloudOrder.status}`, 'info');
                        }
                    });
                    
                    if (orderUpdated) {
                        safeLocalStorageSet('orders_' + CUSTOMER_ID, JSON.stringify(orders));
                    }
                    
                    // Update cache
                    safeLocalStorageSet('cachedMenu', JSON.stringify(menuItems));
                    safeLocalStorageSet('cachedImages', JSON.stringify(itemImages));
                    safeLocalStorageSet('cachedOutletStatus', JSON.stringify(outletOpen));
                    safeLocalStorageSet('cachedOutOfStock', JSON.stringify(outOfStockItems));
                    
                    renderUI();
                    
                } catch (error) {
                    console.log('Cloud fetch failed, using cached/sample data:', error);
                    showNotification('Using offline menu', 'info');
                }
                
            } catch (error) {
                console.error('Load data error:', error);
                // Ultimate fallback - use sample data
                menuItems = [...SAMPLE_MENU];
                itemImages = {...SAMPLE_IMAGES};
                isLoading = false;
                renderUI();
                showNotification('Menu loaded (offline mode)', 'info');
            }
        }

        // ========== SUBMIT ORDER ==========
        window.submitOrder = async function() {
            if (isSubmitting) return;
            
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            
            if (!name || !phone) {
                showNotification('Enter name and phone', 'error');
                return;
            }
            
            isSubmitting = true;
            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing...';
            submitBtn.disabled = true;
            
            const items = [];
            let total = 0;
            
            menuItems.forEach(item => {
                if (outOfStockItems.includes(item.id)) return;
                const qty = quantities[item.id] || 0;
                if (qty > 0) {
                    const itemTotal = qty * item.price;
                    total += itemTotal;
                    items.push({
                        id: item.id,
                        name: item.name,
                        qty: qty,
                        price: item.price,
                        total: itemTotal,
                        note: itemNotes[item.id] || ''
                    });
                }
            });
            
            const timestamp = Date.now();
            const random = Math.floor(Math.random() * 1000);
            const orderId = 'ORD-' + timestamp.toString().slice(-8) + '-' + random;
            
            const order = {
                id: orderId,
                name,
                phone,
                items,
                total,
                status: 'pending',
                timestamp: new Date().toISOString(),
                customerId: CUSTOMER_ID
            };
            
            orders.push(order);
            safeLocalStorageSet('orders_' + CUSTOMER_ID, JSON.stringify(orders));
            
            activeOrder = order;
            
            menuItems.forEach(item => {
                quantities[item.id] = 0;
                delete itemNotes[item.id];
            });
            
            closeOrderModal();
            showOrderConfirmation(order);
            renderUI();
            
            // Try to sync to cloud
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const record = data.record || {};
                    const allOrders = record.orders || [];
                    
                    allOrders.push(order);
                    
                    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_API_KEY
                        },
                        body: JSON.stringify({ 
                            ...record, 
                            orders: allOrders,
                            lastUpdated: new Date().toISOString()
                        })
                    });
                    
                    showNotification('Order placed successfully!', 'success');
                }
            } catch (error) {
                console.log('Order sync failed, saved locally');
                showNotification('Order saved locally', 'info');
            }
            
            submitBtn.innerHTML = '<i class="fas fa-check"></i> Confirm Order';
            submitBtn.disabled = false;
            isSubmitting = false;
        };

        // ========== LIVE TRACKING TIMELINE ==========
        function renderLiveTracking() {
            const container = document.getElementById('liveTrackingContainer');
            if (!container) return;
            
            const active = orders.find(o => o.status !== 'delivered' && o.status !== 'rejected');
            
            if (!active) {
                container.innerHTML = '';
                activeOrder = null;
                if (etaTimer) {
                    clearInterval(etaTimer);
                    etaTimer = null;
                }
                return;
            }
            
            activeOrder = active;
            
            const statusMap = { 'pending': 0, 'accepted': 1, 'preparing': 2, 'ready': 3, 'delivered': 4 };
            const currentStep = statusMap[active.status] || 0;
            
            let eta = '30-40 min';
            if (active.status === 'preparing') eta = '15-20 min';
            if (active.status === 'ready') eta = '5-10 min';
            if (active.status === 'delivered') eta = 'Delivered';
            
            const steps = [
                { icon: 'fa-clipboard-check', label: 'Pending' },
                { icon: 'fa-check-circle', label: 'Accepted' },
                { icon: 'fa-fire', label: 'Preparing' },
                { icon: 'fa-check-double', label: 'Ready' },
                { icon: 'fa-truck', label: 'Delivered' }
            ];
            
            let timelineHtml = steps.map((step, index) => {
                let stepClass = 'tracking-step';
                if (index < currentStep) stepClass += ' completed';
                if (index === currentStep) stepClass += ' active';
                
                return `
                    <div class="${stepClass}">
                        <div class="step-icon">
                            <i class="fas ${step.icon}"></i>
                        </div>
                        <div class="step-label">${step.label}</div>
                    </div>
                `;
            }).join('');
            
            const itemsList = active.items.map(item => 
                `<div>${safeHTML(item.name)} x${item.qty} - ₹${item.total}</div>`
            ).join('');
            
            const orderTime = new Date(active.timestamp).toLocaleTimeString();
            
            container.innerHTML = `
                <div class="live-tracking-card">
                    <div class="tracking-header">
                        <span class="order-id-badge">#${active.id.slice(-6)}</span>
                        <span class="live-badge">
                            <i class="fas fa-circle"></i> LIVE
                        </span>
                    </div>
                    
                    <div class="tracking-timeline">
                        ${timelineHtml}
                    </div>
                    
                    <div class="tracking-details">
                        <div class="detail-row">
                            <span><i class="fas fa-user"></i> ${safeHTML(active.name)}</span>
                            <span><i class="fas fa-clock"></i> ${orderTime}</span>
                        </div>
                        <div class="detail-row">
                            <span><i class="fas fa-phone"></i> ${safeHTML(active.phone)}</span>
                            <span><i class="fas fa-rupee-sign"></i> ₹${active.total}</span>
                        </div>
                        <div style="margin-top: 10px; border-top: 1px dashed #fc8019; padding-top: 10px;">
                            ${itemsList}
                        </div>
                        <div class="eta-timer" id="etaTimer">
                            <i class="fas fa-hourglass-half"></i> ETA: ${eta}
                        </div>
                    </div>
                </div>
            `;
            
            if (active.status !== 'delivered') {
                if (etaTimer) clearInterval(etaTimer);
                
                etaTimer = setInterval(() => {
                    const updatedActive = orders.find(o => o.id === active.id);
                    if (updatedActive && updatedActive.status !== 'delivered') {
                        let newEta = '30-40 min';
                        if (updatedActive.status === 'preparing') newEta = '15-20 min';
                        if (updatedActive.status === 'ready') newEta = '5-10 min';
                        
                        const etaElement = document.getElementById('etaTimer');
                        if (etaElement) {
                            etaElement.innerHTML = `<i class="fas fa-hourglass-half"></i> ETA: ${newEta}`;
                        }
                    } else {
                        clearInterval(etaTimer);
                        etaTimer = null;
                    }
                }, 10000);
            }
        }

        // ========== RENDER FUNCTIONS ==========
        function renderUI() {
            updateOutletStatus();
            renderCategoryTabs();
            renderMenu();
            updateTotals();
            renderLiveTracking();
            checkCurrentOrder();
            updateOrderButtonState();
        }

        function updateOrderButtonState() {
            const orderBtn = document.getElementById('orderBtn');
            let hasItems = false;
            
            menuItems.forEach(item => {
                if (!outOfStockItems.includes(item.id)) {
                    const qty = quantities[item.id] || 0;
                    if (qty > 0) hasItems = true;
                }
            });
            
            orderBtn.disabled = !hasItems || !outletOpen;
            orderBtn.style.opacity = (!hasItems || !outletOpen) ? '0.5' : '1';
        }

        function updateOutletStatus() {
            document.getElementById('statusDot').className = `status-dot ${outletOpen ? 'open' : 'closed'}`;
            document.getElementById('statusText').textContent = `Outlet ${outletOpen ? 'Open' : 'Closed'}`;
            document.getElementById('orderCount').textContent = `${orders.length} orders`;
        }

        function renderCategoryTabs() {
            if (!menuItems || menuItems.length === 0) {
                document.getElementById('categoryTabs').innerHTML = '';
                return;
            }
            
            const categories = [...new Set(menuItems.map(item => item.category))];
            const tabsContainer = document.getElementById('categoryTabs');
            
            let html = '';
            categories.forEach((cat, index) => {
                const safeCat = safeHTML(cat);
                html += `
                    <div class="category-tab ${index === 0 ? 'active' : ''}" onclick="scrollToCategory('${cat.replace(/'/g, "\\'")}', this)">
                        <i class="fas ${getCategoryIcon(cat)}"></i>
                        ${safeCat.split(' ')[1] || safeCat}
                    </div>
                `;
            });
            
            tabsContainer.innerHTML = html;
        }

        function getCategoryIcon(category) {
            if (!category) return 'fa-utensils';
            if (category.includes('Spring')) return 'fa-seedling';
            if (category.includes('Momo')) return 'fa-dumpling';
            if (category.includes('Paneer')) return 'fa-cheese';
            if (category.includes('Burger')) return 'fa-burger';
            if (category.includes('Fries')) return 'fa-french-fries';
            if (category.includes('Pizza')) return 'fa-pizza-slice';
            if (category.includes('Rice')) return 'fa-bowl-rice';
            if (category.includes('Chinese')) return 'fa-egg';
            return 'fa-utensils';
        }

        window.scrollToCategory = function(category, element) {
            document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            
            const catElement = document.getElementById(`category-${category.replace(/\s+/g, '-')}`);
            if (catElement) {
                catElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (!container) return;
            
            if (!menuItems || menuItems.length === 0) {
                container.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Loading menu...</p>
                    </div>
                `;
                return;
            }
            
            const categories = [...new Set(menuItems.map(item => item.category))];
            let html = '';
            
            categories.forEach(cat => {
                let catItems = menuItems.filter(item => item.category === cat);
                
                if (searchTerm) {
                    catItems = catItems.filter(item => 
                        item.name.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                
                if (catItems.length === 0) return;
                
                const catId = `category-${cat.replace(/\s+/g, '-')}`;
                html += `<div id="${catId}" class="category-section">`;
                html += `<div class="category-header"><i class="fas ${getCategoryIcon(cat)}"></i><h3>${safeHTML(cat)}</h3></div>`;
                
                catItems.forEach(item => {
                    const isOutOfStock = outOfStockItems.includes(item.id);
                    const isFavorite = favorites.includes(item.id);
                    const imgSrc = itemImages[item.id] || 'https://via.placeholder.com/80?text=Food';
                    
                    html += `
                        <div class="menu-item ${isOutOfStock ? 'out-of-stock' : ''}">
                            ${isOutOfStock ? '<div class="out-of-stock-badge">OUT</div>' : ''}
                            
                            <div class="item-image-block" onclick="zoomImage('${item.id}')">
                                <img class="item-image" src="${imgSrc}" onerror="this.src='https://via.placeholder.com/80?text=Food'">
                            </div>
                            
                            <div class="item-info">
                                <div class="item-name">
                                    ${safeHTML(item.name)}
                                    ${item.popular ? '<span class="popular-badge">Popular</span>' : ''}
                                    <button class="favorite-btn" onclick="toggleFavorite('${item.id}')">
                                        <i class="fas fa-heart" style="color: ${isFavorite ? '#ff4444' : '#ccc'};"></i>
                                    </button>
                                </div>
                                <div class="item-price">₹${item.price}</div>
                                <div class="item-meta">
                                    <span><i class="far fa-clock"></i> ${item.prepTime || '10 min'}</span>
                                </div>
                                <input type="text" class="item-notes" id="note-${item.id}" 
                                       placeholder="Add note..." 
                                       value="${safeHTML(itemNotes[item.id] || '')}" 
                                       onchange="updateItemNote('${item.id}', this.value)">
                            </div>
                            
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty('${item.id}', -1)" ${isOutOfStock || !outletOpen ? 'disabled' : ''}>
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="qty-num" id="qty-${item.id}">${quantities[item.id] || 0}</span>
                                <button class="qty-btn" onclick="updateQty('${item.id}', 1)" ${isOutOfStock || !outletOpen ? 'disabled' : ''}>
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            if (html === '') {
                html = '<div style="text-align: center; padding: 40px;">No items found</div>';
            }
            
            container.innerHTML = html;
        }

        window.toggleFavorite = function(itemId) {
            if (favorites.includes(itemId)) {
                favorites = favorites.filter(id => id !== itemId);
                showNotification('Removed from favorites');
            } else {
                favorites.push(itemId);
                showNotification('Added to favorites ❤️');
            }
            safeLocalStorageSet('favorites_' + CUSTOMER_ID, JSON.stringify(favorites));
            renderMenu();
        };

        window.updateItemNote = function(itemId, note) {
            itemNotes[itemId] = note;
        };

        window.updateQty = function(id, delta) {
            if (!outletOpen) {
                showNotification('Outlet is closed', 'error');
                return;
            }
            
            if (outOfStockItems.includes(id)) {
                showNotification('Item out of stock', 'error');
                return;
            }
            
            const newVal = (quantities[id] || 0) + delta;
            if (newVal >= 0) {
                quantities[id] = newVal;
                const qtyElement = document.getElementById(`qty-${id}`);
                if (qtyElement) qtyElement.textContent = newVal;
                updateTotals();
                updateOrderButtonState();
            }
        };

        window.clearCart = function() {
            if (confirm('Clear cart?')) {
                menuItems.forEach(item => {
                    quantities[item.id] = 0;
                    const noteInput = document.getElementById(`note-${item.id}`);
                    if (noteInput) noteInput.value = '';
                });
                itemNotes = {};
                renderMenu();
                updateTotals();
                updateOrderButtonState();
                showNotification('Cart cleared');
            }
        };

        function updateTotals() {
            let totalItems = 0, totalPrice = 0;
            
            menuItems.forEach(item => {
                if (!outOfStockItems.includes(item.id)) {
                    const qty = quantities[item.id] || 0;
                    totalItems += qty;
                    totalPrice += qty * item.price;
                }
            });
            
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalPrice').textContent = `₹${totalPrice}`;
            document.getElementById('totalPay').textContent = `₹${totalPrice}`;
        }

        window.zoomImage = function(itemId) {
            const imgSrc = itemImages[itemId];
            const zoomModal = document.getElementById('zoomModal');
            const zoomImage = document.getElementById('zoomImage');
            
            if (imgSrc) {
                zoomImage.src = imgSrc;
            } else {
                zoomImage.src = 'https://via.placeholder.com/400?text=No+Image';
            }
            
            zoomModal.style.display = 'flex';
        };

        window.closeZoomModal = function() {
            document.getElementById('zoomModal').style.display = 'none';
        };

        window.showFavorites = function() {
            const favItems = menuItems.filter(item => favorites.includes(item.id));
            let html = '';
            
            if (favItems.length === 0) {
                html = '<div style="text-align: center;">No favorites</div>';
            } else {
                favItems.forEach(item => {
                    html += `
                        <div class="preview-item" style="cursor: pointer;" onclick="addToCartFromFavorite('${item.id}')">
                            <span>${safeHTML(item.name)}</span>
                            <span>₹${item.price}</span>
                        </div>
                    `;
                });
            }
            
            document.getElementById('favoritesList').innerHTML = html;
            document.getElementById('favoritesModal').style.display = 'flex';
        };

        window.addToCartFromFavorite = function(itemId) {
            updateQty(itemId, 1);
            closeFavoritesModal();
        };

        window.closeFavoritesModal = function() {
            document.getElementById('favoritesModal').style.display = 'none';
        };

        window.showHistory = function() {
            if (orders.length === 0) {
                showNotification('No orders yet', 'info');
                return;
            }
            
            let html = '<h3 style="margin-bottom: 10px;">Recent Orders</h3>';
            orders.slice(-5).reverse().forEach(order => {
                html += `
                    <div class="preview-item" style="cursor: pointer;" onclick="showOrderDetails('${order.id}')">
                        <span>#${order.id.slice(-6)}</span>
                        <span class="status-badge" style="background: ${getStatusColor(order.status)}; color: white; padding: 2px 8px; border-radius: 12px;">${order.status}</span>
                        <span>₹${order.total}</span>
                    </div>
                `;
            });
            
            document.getElementById('favoritesList').innerHTML = html;
            document.getElementById('favoritesModal').style.display = 'flex';
        };

        function getStatusColor(status) {
            switch(status) {
                case 'pending': return '#ff9800';
                case 'accepted': return '#4CAF50';
                case 'preparing': return '#2196F3';
                case 'ready': return '#9C27B0';
                case 'delivered': return '#4CAF50';
                case 'rejected': return '#ff4444';
                default: return '#999';
            }
        }

        window.reorderLast = function() {
            if (orders.length === 0) {
                showNotification('No previous orders', 'info');
                return;
            }
            
            const lastOrder = orders[orders.length - 1];
            
            menuItems.forEach(item => quantities[item.id] = 0);
            
            lastOrder.items.forEach(item => {
                const menuItem = menuItems.find(m => m.id === item.id || m.name === item.name);
                if (menuItem && !outOfStockItems.includes(menuItem.id)) {
                    quantities[menuItem.id] = item.qty;
                    if (item.note) itemNotes[menuItem.id] = item.note;
                }
            });
            
            renderMenu();
            updateTotals();
            updateOrderButtonState();
            showNotification('Last order added to cart');
        };

        window.openOrderModal = function() {
            if (!outletOpen) {
                showNotification('Outlet is closed', 'error');
                return;
            }
            
            let hasItems = false;
            let previewHtml = '';
            let total = 0;
            
            menuItems.forEach(item => {
                if (outOfStockItems.includes(item.id)) return;
                const qty = quantities[item.id] || 0;
                if (qty > 0) {
                    hasItems = true;
                    const itemTotal = qty * item.price;
                    total += itemTotal;
                    previewHtml += `
                        <div class="preview-item">
                            <span>${safeHTML(item.name)} x${qty}</span>
                            <span>₹${itemTotal}</span>
                        </div>
                    `;
                    if (itemNotes[item.id]) {
                        previewHtml += `<div style="font-size: 0.7rem; color: #666;">📝 ${safeHTML(itemNotes[item.id])}</div>`;
                    }
                }
            });
            
            if (!hasItems) {
                showNotification('Cart is empty', 'error');
                return;
            }
            
            previewHtml += `<div class="preview-total">Total: ₹${total}</div>`;
            document.getElementById('orderPreview').innerHTML = previewHtml;
            
            document.getElementById('orderModal').style.display = 'flex';
        };

        window.closeOrderModal = function() {
            document.getElementById('orderModal').style.display = 'none';
        };

        function showOrderConfirmation(order) {
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div class="preview-item">
                        <span>${safeHTML(item.name)} x${item.qty}</span>
                        <span>₹${item.total}</span>
                    </div>
                `;
            });
            
            document.getElementById('confirmedOrderPreview').innerHTML = itemsHtml;
            document.getElementById('orderIdDisplay').textContent = `#${order.id}`;
            document.getElementById('confirmationModal').style.display = 'flex';
        }

        window.closeConfirmationModal = function() {
            document.getElementById('confirmationModal').style.display = 'none';
            renderLiveTracking();
        };

        function checkCurrentOrder() {
            const pendingOrder = orders.find(o => o.status !== 'delivered' && o.status !== 'rejected');
            
            if (pendingOrder) {
                renderOrderStatus(pendingOrder);
            } else {
                document.getElementById('currentOrderStatus').innerHTML = '';
            }
        }

        function renderOrderStatus(order) {
            const statusMap = { 'pending': 0, 'accepted': 1, 'preparing': 2, 'ready': 3, 'delivered': 4 };
            const currentStep = statusMap[order.status] || 0;
            
            let html = `
                <div class="order-status-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="font-weight: 600;">#${order.id.slice(-6)}</span>
                        <span>${new Date(order.timestamp).toLocaleTimeString()}</span>
                    </div>
                    
                    <div class="status-timeline">
                        <div class="status-step ${currentStep >= 0 ? 'completed' : ''} ${currentStep === 0 ? 'active' : ''}">
                            <div class="step-icon"><i class="fas fa-clipboard-check"></i></div>
                            <div class="step-label">Pending</div>
                        </div>
                        <div class="status-step ${currentStep >= 1 ? 'completed' : ''} ${currentStep === 1 ? 'active' : ''}">
                            <div class="step-icon"><i class="fas fa-check-circle"></i></div>
                            <div class="step-label">Accepted</div>
                        </div>
                        <div class="status-step ${currentStep >= 2 ? 'completed' : ''} ${currentStep === 2 ? 'active' : ''}">
                            <div class="step-icon"><i class="fas fa-fire"></i></div>
                            <div class="step-label">Preparing</div>
                        </div>
                        <div class="status-step ${currentStep >= 3 ? 'completed' : ''} ${currentStep === 3 ? 'active' : ''}">
                            <div class="step-icon"><i class="fas fa-check-double"></i></div>
                            <div class="step-label">Ready</div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('currentOrderStatus').innerHTML = html;
        }

        window.showOrderDetails = function(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div class="preview-item">
                        <span>${safeHTML(item.name)} x${item.qty}</span>
                        <span>₹${item.total}</span>
                    </div>
                `;
            });
            
            itemsHtml += `<div class="preview-total">Total: ₹${order.total}</div>`;
            
            document.getElementById('favoritesList').innerHTML = itemsHtml;
            document.getElementById('favoritesModal').style.display = 'flex';
        };

        // ========== PULL TO REFRESH ==========
        class PullToRefresh {
            constructor(containerId, onRefresh) {
                this.container = document.getElementById(containerId);
                this.onRefresh = onRefresh;
                this.indicator = document.getElementById('ptrIndicator');
                this.startY = 0;
                this.currentY = 0;
                this.isPulling = false;
                this.threshold = 80;
                this.indicatorHeight = 60;
                
                this.init();
            }

            init() {
                this.container.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.container.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.container.addEventListener('touchend', (e) => this.handleTouchEnd(e));
            }

            handleTouchStart(e) {
                if (window.scrollY === 0) {
                    this.startY = e.touches[0].clientY;
                    this.isPulling = true;
                }
            }

            handleTouchMove(e) {
                if (!this.isPulling) return;
                
                this.currentY = e.touches[0].clientY;
                const pullDistance = this.currentY - this.startY;
                
                if (pullDistance > 0 && pullDistance < this.threshold) {
                    e.preventDefault();
                    this.indicator.style.transform = `translateY(${pullDistance - this.indicatorHeight}px)`;
                } else if (pullDistance >= this.threshold) {
                    this.indicator.classList.add('show');
                    this.indicator.style.transform = 'translateY(0)';
                }
            }

            handleTouchEnd(e) {
                if (!this.isPulling) return;
                
                const pullDistance = this.currentY - this.startY;
                
                if (pullDistance >= this.threshold) {
                    this.refresh();
                } else {
                    this.indicator.style.transform = `translateY(-${this.indicatorHeight}px)`;
                    setTimeout(() => {
                        this.indicator.classList.remove('show');
                        this.indicator.style.transform = '';
                    }, 300);
                }
                
                this.isPulling = false;
            }

            async refresh() {
                await this.onRefresh();
                setTimeout(() => {
                    this.indicator.classList.remove('show');
                    this.indicator.style.transform = `translateY(-${this.indicatorHeight}px)`;
                    setTimeout(() => {
                        this.indicator.style.transform = '';
                    }, 300);
                }, 500);
            }
        }

        // ========== INIT ==========
        async function init() {
            // Show loading immediately
            renderMenu();
            
            // Load data
            await loadData();
            
            // Pull to refresh
            pullToRefresh = new PullToRefresh('app', async () => {
                await loadData();
                showNotification('Menu updated');
            });
            
            // Auto refresh every 15 seconds
            setInterval(() => loadData(), 15000);
            
            // Order button
            document.getElementById('orderBtn').addEventListener('click', openOrderModal);
            
            // ESC key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeZoomModal();
                    closeOrderModal();
                    closeConfirmationModal();
                    closeFavoritesModal();
                }
            });
        }

        // Start the app
        init();
    </script>
</body>
</html>
